<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>WebFruitOS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <meta name="description" content="Pint-Sized Software">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>
    <header>
        <img src="assets/webfruitos_bw.png" alt="WebFruitOS Logo">
        <div id="menubar">WebFruitOS</div>
    </header>
    <main>
        <div id="desktop">

        </div>
    </main>
    <nav>
        <div class="dock">
            <div class="dock-container">
                <div class="button-container">
                    <em><span>Home</span></em>
                    <img id="home" src="assets/icon_webfruitos.png" alt="Home Button">
                    <div class="active-dot"></div>
                </div>
                <div class="button-container">
                    <em><span>GitHub</span></em>
                    <img id="github" src="assets/icon_github.png" alt="GitHub Button">
                    <div class="active-dot"></div>
                </div>
                <div class="button-container">
                    <em><span>Contact</span></em>
                    <img id="contact" src="assets/icon_contact.png" alt="Contact Button">
                    <div class="active-dot"></div>
                </div>
                <div class="button-container">
                    <em><span>Links</span></em>
                    <img id="links" src="assets/icon_links.png" alt="Links Button">
                    <div class="active-dot"></div>
                </div>
                <div class="dock-sep">
                    <div class="dock-sep-line"></div>
                </div>
                <div class="button-container">
                    <em><span>Product</span></em>
                    <img id="product" src="assets/icon_product.png" alt="Product Button">
                    <div class="active-dot"></div>
                </div>
            </div>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="js/index.js"></script>
</body>

</html>
